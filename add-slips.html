<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Slips — Ile Amao</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; color: #1A1D23; }
    h1 { color: #1B2A4A; font-size: 22px; margin-bottom: 4px; }
    p.sub { color: #5A6370; font-size: 14px; margin-top: 0; }
    textarea { width: 100%; height: 160px; font-family: ui-monospace, Menlo, Consolas, monospace;
               font-size: 12px; padding: 10px; border: 1px solid #CED3D9; border-radius: 8px; }
    .btn { padding: 12px 24px; background: #1B2A4A; color: #fff; border: none;
           border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.go { background: #7A9E7E; }
    #status { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: #F1F3F5; font-size: 14px; }
    .ok { background: #EDF5EE !important; color: #2E7D32; }
    .err { background: #FEE2E2 !important; color: #DC2626; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th { text-align: left; color: #5A6370; font-size: 11px; text-transform: uppercase;
         letter-spacing: .4px; border-bottom: 2px solid #E2E5E9; padding: 6px 4px; }
    td { padding: 6px 4px; border-bottom: 1px solid #F1F3F5; }
    td.amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr.dup { color: #98A1AE; }
    .tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
           text-transform: uppercase; letter-spacing: .3px; }
    .tag.new { background: #EDF5EE; color: #2E7D32; }
    .tag.dup { background: #F1F3F5; color: #6B7685; }
  </style>
</head>
<body>
  <h1>Add Slips</h1>
  <p class="sub">Paste slip JSON below. Anything already in Firebase (same date and amount) is
     skipped, so running this twice is safe.</p>

  <textarea id="input" placeholder='{ "bank_20261029_00": { "date": "2026-10-29", ... } }'></textarea>
  <button class="btn" id="checkBtn">Check against Firebase</button>

  <div id="status"></div>
  <div id="preview"></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDQ_JCp4JIDGN3iKx9RV9tB5S8IsnYWsZ8",
  authDomain: "ile-amao.firebaseapp.com",
  databaseURL: "https://ile-amao-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ile-amao",
  storageBucket: "ile-amao.firebasestorage.app",
  messagingSenderId: "870686278977",
  appId: "1:870686278977:web:6a1e3e0573d7f7fc3a0dc0"
});

const slipsRef = firebase.database().ref('slips');
const statusEl = document.getElementById('status');
const previewEl = document.getElementById('preview');
let toAdd = null;

const money = n => 'R' + Number(n).toLocaleString('en-ZA',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const key = s => s.date + '|' + Number(s.amount).toFixed(2);

function say(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ''; }

document.getElementById('checkBtn').addEventListener('click', async () => {
  previewEl.innerHTML = '';
  toAdd = null;

  let incoming;
  try {
    incoming = JSON.parse(document.getElementById('input').value);
    if (!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) throw 0;
    if (!Object.keys(incoming).length) throw 0;
  } catch {
    return say("That doesn't look like slip JSON — paste the whole file contents.", 'err');
  }

  say('Signing in and reading what is already there…');
  let existing;
  try {
    await firebase.auth().signInAnonymously();
    existing = (await slipsRef.once('value')).val() || {};
  } catch (err) {
    return say('Could not reach the database: ' + (err.code || err.message), 'err');
  }

  // Match on date + amount: catches rows already logged by hand in the app,
  // which carry different keys to the ones in the pasted file.
  const have = new Set(Object.values(existing)
    .filter(s => s && s.date && s.amount != null).map(key));

  const rows = Object.entries(incoming).map(([k, s]) => ({
    k, s, dup: have.has(key(s))
  }));
  toAdd = rows.filter(r => !r.dup);

  const total = toAdd.reduce((t, r) => t + Number(r.s.amount), 0);
  say(`${Object.keys(existing).length} slips already in Firebase. ` +
      `${toAdd.length} of your ${rows.length} rows are new (${money(total)}); ` +
      `${rows.length - toAdd.length} already there.`);

  previewEl.innerHTML = `
    <table><thead><tr><th></th><th>Date</th><th>Category</th><th>Comment</th><th class="amt">Amount</th></tr></thead>
    <tbody>${rows.map(r => `
      <tr class="${r.dup ? 'dup' : ''}">
        <td><span class="tag ${r.dup ? 'dup' : 'new'}">${r.dup ? 'skip' : 'new'}</span></td>
        <td>${esc(r.s.date || '')}</td>
        <td>${esc(r.s.category || '')}</td>
        <td>${esc(r.s.comment || '')}</td>
        <td class="amt">${money(r.s.amount)}</td>
      </tr>`).join('')}</tbody></table>` +
    (toAdd.length ? `<button class="btn go" id="importBtn">Add these ${toAdd.length} slips</button>`
                  : `<p class="sub">Nothing to add — everything is already in there.</p>`);

  const go = document.getElementById('importBtn');
  if (go) go.addEventListener('click', doImport);
});

async function doImport() {
  const btn = document.getElementById('importBtn');
  btn.disabled = true;
  say('Adding…');
  try {
    const updates = {};
    toAdd.forEach(r => { updates[r.k] = r.s; });
    await slipsRef.update(updates);
    say(`Done — added ${toAdd.length} slips. Open the app and check the Slips tab.`, 'ok');
    btn.remove();
  } catch (err) {
    say('Failed: ' + (err.code || err.message), 'err');
    btn.disabled = false;
  }
}
</script>
</body>
</html>
